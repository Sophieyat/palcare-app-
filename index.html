<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bolton Practice — GP Appointment</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --nhs: #005EB8; --nhs-dark: #003F7F; --nhs-light: #E8F1FA;
    --white: #fff; --off: #F4F7FB; --text: #1a1a2e; --muted: #6b7a99;
    --bubble-helen: #EAF2FF; --bubble-user: #005EB8; --radius: 18px;
  }
  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--off); color: var(--text); overflow: hidden; }
  .phone { max-width: 390px; height: 100dvh; margin: 0 auto; background: var(--white); display: flex; flex-direction: column; overflow: hidden; }

  /* HEADER */
  .header { background: var(--nhs); padding: 52px 20px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .header-logo { width: 40px; height: 40px; background: var(--white); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-logo svg { width: 26px; height: 26px; }
  .header-text h1 { font-family: 'DM Serif Display', serif; font-size: 17px; color: var(--white); line-height: 1.2; }
  .header-text p { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 300; }
  .header-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.85); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* HOME SCREEN */
  #home-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; gap: 28px; }
  .welcome-card { background: var(--nhs-light); border-radius: var(--radius); padding: 20px; width: 100%; border-left: 4px solid var(--nhs); }
  .welcome-card h2 { font-size: 18px; font-weight: 700; color: var(--nhs-dark); margin-bottom: 6px; }
  .welcome-card p { font-size: 16px; color: var(--muted); line-height: 1.6; }
  .start-btn { width: 140px; height: 140px; border-radius: 50%; background: var(--nhs); border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 32px rgba(0,94,184,0.35); position: relative; -webkit-tap-highlight-color: transparent; transition: transform 0.15s; }
  .start-btn:active { transform: scale(0.95); }
  .start-btn svg { width: 44px; height: 44px; color: white; }
  .start-btn span { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.95); }
  .ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(0,94,184,0.3); animation: ring 2.5s ease-out infinite; }
  .ring:nth-child(2){animation-delay:0.8s} .ring:nth-child(3){animation-delay:1.6s}
  @keyframes ring { 0%{transform:scale(1);opacity:0.8} 100%{transform:scale(1.6);opacity:0} }
  .disclaimer { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }

  /* VOICE SCREEN */
  #voice-screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .voice-top-bar { background: var(--nhs); padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .waveform { display: flex; align-items: center; gap: 3px; height: 24px; }
  .waveform span { width: 3px; border-radius: 2px; background: rgba(255,255,255,0.6); height: 4px; }
  .waveform.active span { animation: wave 0.6s ease-in-out infinite; }
  .waveform.active span:nth-child(1){animation-delay:0s}
  .waveform.active span:nth-child(2){animation-delay:0.1s}
  .waveform.active span:nth-child(3){animation-delay:0.2s}
  .waveform.active span:nth-child(4){animation-delay:0.3s}
  .waveform.active span:nth-child(5){animation-delay:0.4s}
  .waveform.active span:nth-child(6){animation-delay:0.3s}
  .waveform.active span:nth-child(7){animation-delay:0.2s}
  @keyframes wave { 0%,100%{height:3px} 50%{height:18px} }
  .voice-status-text { font-size: 14px; font-weight: 600; color: white; }
  .end-call-btn { margin-left: auto; padding: 6px 16px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 20px; font-size: 13px; font-weight: 600; color: white; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* Widget takes full remaining space */
  .widget-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  elevenlabs-convai { display: block !important; width: 100% !important; flex: 1; }
</style>
</head>
<body>
<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="header-logo">
      <svg viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="12" fill="#005EB8"/>
        <polyline points="4,13 8,13 10,8 13,18 16,10 18,13 22,13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Bolton Practice</h1>
      <p>GP appointment booking</p>
    </div>
    <div class="header-status">
      <div class="status-dot"></div>
      <span>Online</span>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="welcome-card">
      <h2>Hello, welcome</h2>
      <p>Tap the microphone to speak with Helen, our receptionist. She will help you book a GP appointment.</p>
    </div>
    <button class="start-btn" onclick="goVoice()">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <span>Tap to speak</span>
    </button>
    <p class="disclaimer">⚠️ Research prototype — not a real GP service<br>University of Roehampton · MSc Digital Health</p>
  </div>

  <!-- VOICE SCREEN -->
  <div id="voice-screen">
    <div class="voice-top-bar">
      <div class="waveform" id="waveform">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <span class="voice-status-text" id="vstatus">Connecting to Helen...</span>
      <button class="end-call-btn" onclick="goHome()">End call</button>
    </div>
    <div class="widget-wrap">
      <elevenlabs-convai agent-id="agent_6701kt0ajthff0k8qws2fwhwpw47"></elevenlabs-convai>
    </div>
  </div>

</div>

<script src="https://elevenlabs.io/convai-widget/index.js" async></script>
<script>
  function goVoice() {
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('voice-screen').style.display = 'flex';
  }
  function goHome() {
    document.getElementById('voice-screen').style.display = 'none';
    document.getElementById('home-screen').style.display = 'flex';
  }

  // Status updates
  const waveformEl = document.getElementById('waveform');
  const vstatusEl  = document.getElementById('vstatus');
  function setVS(txt, anim) {
    vstatusEl.textContent = txt;
    anim ? waveformEl.classList.add('active') : waveformEl.classList.remove('active');
  }
  window.addEventListener('elevenlabs-convai:connect',            () => setVS('Helen is ready', false));
  window.addEventListener('elevenlabs-convai:agent_start_talking',() => setVS('Helen is speaking...', true));
  window.addEventListener('elevenlabs-convai:agent_stop_talking', () => setVS('Listening...', false));
  window.addEventListener('elevenlabs-convai:user_start_talking', () => setVS('You are speaking...', false));
  window.addEventListener('elevenlabs-convai:user_stop_talking',  () => setVS('Helen is thinking...', true));
  window.addEventListener('elevenlabs-convai:disconnect',         () => setVS('Call ended', false));
</script>
</body>
</html>
